name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install schema compiler
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-bin
      - name: Unit tests
        run: npm test
      - name: JavaScript and GSettings validation
        run: python3 tools/manage.py validate
      - name: Python syntax
        run: python3 -m py_compile tools/manage.py tools/smoke.py
      - name: Build extension bundle
        run: python3 tools/manage.py pack
